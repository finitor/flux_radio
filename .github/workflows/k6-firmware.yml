name: Flux firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm
          rustup toolchain install stable --profile minimal --target thumbv6m-none-eabi
      - name: Install Python build dependencies
        run: python -m pip install -r requirements.txt
      - name: Build host image and starter modules
        env:
          K6_MOD_KEY_FILE: ${{ runner.temp }}/k6-mod.key
        run: |
          umask 077
          python3 -c 'import secrets; print(secrets.token_hex(16))' > "$K6_MOD_KEY_FILE"
          sh firmware/k6-aura/build-blowfang-host.sh
      - name: Check output fits the K6
        run: |
          cat firmware/k6-aura/out-fd6818b/size.txt
          test -s firmware/k6-aura/out-fd6818b/flux-fd6818b.bin
          test -s firmware/k6-aura/out-fd6818b/vfo-module-bundle/manifest.json
          test -s firmware/k6-aura/out-fd6818b/cardlink-module-bundle/manifest.json
