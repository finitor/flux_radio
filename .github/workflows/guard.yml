# Files that must never be committed here: K6 bootloader dumps, Yaesu firmware, module signing
# keys and built images. The unsigned SDK example and source boot artwork are explicit exceptions.
name: Forbidden files
on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no binaries, bootloaders, Yaesu images or keys
        run: |
          bad=$(git ls-files | grep -iE \
            -e '\.bin$' \
            -e '\.elf$' \
            -e '\.hex$' \
            -e '\.key$' \
            -e '\.(pem|p12|pfx)$' \
            -e '(^|/)\.env($|\.)' \
            -e '\.a$' \
            -e 'boot\.bin' \
            -e 'k6-boot' \
            -e 'yaesu' \
            -e 'ftm-?300' \
            | grep -vxF sdk/module-example/dist/module.bin \
            | grep -vxF flux-art-kit/flux-arrays/splash.bin \
            || true)
          if [ -n "$bad" ]; then
            echo "These files must not be in the repository:"
            echo "$bad"
            exit 1
          fi
          python3 - <<'PYHASH'
          import hashlib, json
          from pathlib import Path
          bundle = Path("sdk/module-example/dist")
          manifest = json.loads((bundle / "manifest.json").read_text())
          assert hashlib.sha256((bundle / "module.bin").read_bytes()).hexdigest() == manifest["sha256"]["module.bin"]
          PYHASH
          test "$(wc -c < flux-art-kit/flux-arrays/splash.bin)" -eq 1024
          echo "clean"
