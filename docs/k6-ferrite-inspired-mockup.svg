<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
  <title id="title">Ferrite-inspired monochrome K6 screen proposal</title>
  <desc id="desc">Three 128 by 64 pixel screen concepts: Aura radio standby, quick settings, and Blowfang module shelf.</desc>
  <rect width="1120" height="440" fill="#e9e9e5"/>
  <text x="40" y="42" font-family="sans-serif" font-size="22" font-weight="700" fill="#161616">A calmer K6 interface</text>
  <text x="40" y="66" font-family="sans-serif" font-size="12" fill="#444">128 × 64 monochrome · Aura radio core · Blowfang apps</text>
  <defs>
    <g id="radio" font-family="monospace" fill="#111">
      <rect width="128" height="64" fill="#fff"/>
      <rect width="128" height="10" fill="#111"/>
      <text x="4" y="7.5" fill="#fff" font-size="6">AG7SU   VFO A</text><text x="106" y="7.5" fill="#fff" font-size="6">FM W</text>
      <text x="5" y="18" font-size="6">A · ACTIVE</text><text x="97" y="18" font-size="6">SQL 3</text>
      <text x="4" y="36" font-size="17" font-weight="700">146.520</text><text x="91" y="34" font-size="6">MHz</text>
      <line x1="4" y1="40" x2="124" y2="40" stroke="#111" stroke-width=".7"/>
      <text x="5" y="49" font-size="7" font-weight="700">B</text><text x="14" y="49" font-size="7">446.000</text><text x="65" y="49" font-size="6">FM W</text><text x="96" y="49" font-size="6">MEM08</text>
      <rect x="0" y="54" width="128" height="10" fill="#111"/>
      <text x="4" y="61" font-size="6" fill="#fff">A/B</text><text x="35" y="61" font-size="6" fill="#fff">MEM</text><text x="72" y="61" font-size="6" fill="#fff">MENU</text><text x="105" y="61" font-size="6" fill="#fff">BLOWFANG</text>
    </g>
    <g id="quick" font-family="monospace" fill="#111">
      <rect width="128" height="64" fill="#fff"/>
      <rect width="128" height="9" fill="#111"/><text x="4" y="7" fill="#fff" font-size="6">QUICK SETTINGS</text><text x="105" y="7" fill="#fff" font-size="6">1 / 4</text>
      <rect x="3" y="11" width="122" height="10" fill="#111"/><text x="7" y="18.5" fill="#fff" font-size="7">Squelch</text><text x="101" y="18.5" fill="#fff" font-size="7">3</text>
      <text x="7" y="31" font-size="7">Power</text><text x="101" y="31" font-size="7">HIGH</text><line x1="4" y1="34" x2="124" y2="34" stroke="#aaa" stroke-width=".5"/>
      <text x="7" y="43" font-size="7">Step</text><text x="101" y="43" font-size="7">12.5k</text><line x1="4" y1="46" x2="124" y2="46" stroke="#aaa" stroke-width=".5"/>
      <text x="7" y="55" font-size="7">Tone / offset</text><text x="101" y="55" font-size="7">›</text>
      <rect y="58" width="128" height="6" fill="#111"/><text x="4" y="63" font-size="5" fill="#fff">▲▼ move    MENU edit    EXIT</text>
    </g>
    <g id="apps" font-family="monospace" fill="#111">
      <rect width="128" height="64" fill="#fff"/>
      <rect width="128" height="10" fill="#111"/><text x="4" y="7.5" fill="#fff" font-size="6">BLOWFANG  ·  5 APPS</text><text x="108" y="7.5" fill="#fff" font-size="6">1/5</text>
      <rect x="3" y="13" width="122" height="11" fill="#111"/><text x="8" y="21" fill="#fff" font-size="7">SURF</text><text x="98" y="21" fill="#fff" font-size="6">SCAN</text>
      <text x="8" y="33" font-size="7">APRS RX</text><text x="98" y="33" font-size="6">MODEM</text><line x1="4" y1="36" x2="124" y2="36" stroke="#bbb" stroke-width=".5"/>
      <text x="8" y="45" font-size="7">EXPLORE</text><text x="98" y="45" font-size="6">TOOLS</text>
      <rect x="3" y="50" width="122" height="11" fill="#eee" stroke="#111" stroke-width=".6"/><text x="8" y="58" font-size="7" font-weight="700">AURA RADIO</text><text x="98" y="58" font-size="6">RETURN</text>
    </g>
  </defs>
  <g transform="translate(38 104)">
    <rect width="324" height="230" rx="18" fill="#222"/><rect x="8" y="8" width="308" height="214" rx="12" fill="#333"/>
    <g transform="translate(34 42) scale(2)" shape-rendering="crispEdges"><use href="#radio"/></g>
    <text x="18" y="208" font-family="sans-serif" font-size="12" fill="#fff">01 · RADIO</text>
  </g>
  <g transform="translate(398 104)">
    <rect width="324" height="230" rx="18" fill="#222"/><rect x="8" y="8" width="308" height="214" rx="12" fill="#333"/>
    <g transform="translate(34 42) scale(2)" shape-rendering="crispEdges"><use href="#quick"/></g>
    <text x="18" y="208" font-family="sans-serif" font-size="12" fill="#fff">02 · QUICK SETTINGS</text>
  </g>
  <g transform="translate(758 104)">
    <rect width="324" height="230" rx="18" fill="#222"/><rect x="8" y="8" width="308" height="214" rx="12" fill="#333"/>
    <g transform="translate(34 42) scale(2)" shape-rendering="crispEdges"><use href="#apps"/></g>
    <text x="18" y="208" font-family="sans-serif" font-size="12" fill="#fff">03 · BLOWFANG APPS</text>
  </g>
  <text x="40" y="372" font-family="sans-serif" font-size="12" fill="#333">Keep Aura's existing radio behavior. Add the compact visual layer and put specialized features in sideloaded modules.</text>
  <text x="40" y="396" font-family="sans-serif" font-size="11" fill="#555">Simultaneous dual receive, GPS, Bluetooth, broadcast/HF and crossband features need hardware the K6 does not have.</text>
</svg>
